<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4eee6"><meta name="robots" content="noindex,follow">
<title>My Wishlist | Outfit Reload 3.0</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:#f4eee6;color:#211b16;font-family:Arial,sans-serif}.head{min-height:68px;background:#fffdf9;border-bottom:1px solid #e8ded3;display:flex;align-items:center;justify-content:space-between;padding:12px clamp(16px,5vw,65px)}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-size:12px;font-weight:800;letter-spacing:.1em}.mark{width:36px;height:36px;display:grid;place-items:center;background:#211b16;color:white}.brand small{display:block;font-size:9px;color:#9a8877;margin-top:4px}.back{font-size:12px;color:#786858;text-decoration:none}.wrap{width:min(100% - 30px,1000px);margin:38px auto 90px}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:800;color:#a17e5b;margin:0 0 10px}.title{font-size:clamp(30px,5vw,44px);margin:0}.intro{color:#85796d;font-size:13px;line-height:1.7;margin:8px 0 25px}.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:12px}.count{font-size:12px;color:#88796a}.refresh{border:1px solid #211b16;background:#fffdf9;padding:10px 14px;font-size:10px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.item{position:relative;background:#fffdf9;border:1px solid #e8ded3;overflow:hidden}.photo{display:block;aspect-ratio:4/4.7;background:#eee5da}.photo img{width:100%;height:100%;object-fit:cover;display:block}.info{padding:13px 14px 15px}.name{font-size:13px;font-weight:700;margin:0 0 7px}.price{font-size:13px;color:#8b6746;font-weight:800}.remove{position:absolute;top:10px;right:10px;border:0;border-radius:50%;width:32px;height:32px;background:#211b16;color:white;font-size:20px;cursor:pointer}.shop{display:inline-block;margin-top:11px;background:#211b16;color:#fff;text-decoration:none;padding:10px 13px;font-size:9px;font-weight:800;letter-spacing:.1em}.empty,.error{padding:35px 20px;text-align:center;background:#fffdf9;border:1px dashed #d9cbbb;grid-column:1/-1}.empty b{font-size:22px}.empty p,.error{font-size:12px;color:#88796a;line-height:1.7}.footer{text-align:center;color:#9a8d80;font-size:9px;letter-spacing:.12em;padding:22px}@media(max-width:700px){.wrap{margin:25px auto 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info{padding:10px}.head{min-height:60px}.brand{font-size:10px}.mark{width:32px;height:32px}}
</style>
</head>
<body>
<header class="head"><a class="brand" href="index.html"><span class="mark">OR</span><span>OUTFIT RELOAD <small>3.0 · MEN'S COLLECTION</small></span></a><a class="back" href="index.html">← Continue shopping</a></header>
<main class="wrap"><p class="eyebrow">YOUR SAVED SELECTION</p><h1 class="title">My Wishlist.</h1><p class="intro">The pieces you love, all in one place.</p><div class="tools"><span class="count" id="wishCount">Checking your saved items…</span><button class="refresh" id="refreshWishlist" type="button">REFRESH ↻</button></div><div id="wishlistGrid" class="grid"><p class="count">Wishlist is starting…</p></div></main>
<footer class="footer">© 2026 OUTFIT RELOAD 3.0 · BANGLADESH</footer>
<script>
(()=>{
'use strict';
const SUPABASE_URL='https://hhvpajotquhhatrraamx.supabase.co';
const SUPABASE_KEY='sb_publishable_p89OyWNamcMqf70A-dTeIw_TLzev2ZE';
const host=document.getElementById('wishlistGrid'), count=document.getElementById('wishCount');
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'৳ '+Number(v||0).toLocaleString('en-BD');
function ids(){try{const a=JSON.parse(localStorage.getItem('or_wishlist')||'[]');return Array.isArray(a)?[...new Set(a.map(String))]:[]}catch(e){return []}}
function empty(title,desc){host.innerHTML='<div class="empty"><b>'+safe(title)+'</b><p>'+safe(desc)+'</p><a class="shop" href="index.html#new">EXPLORE COLLECTION ↗</a></div>'}
async function render(){
 const saved=ids(); count.textContent=saved.length+' saved item'+(saved.length===1?'':'s');
 if(!saved.length){empty('Your wishlist is waiting.','Tap the heart on a product to save it here.');return}
 host.innerHTML='<p class="count">Loading saved products…</p>';
 try{
  const params=new URLSearchParams();params.set('select','id,name,price,sale_price,image_urls,is_active');params.set('id','in.('+saved.join(',')+')');
  const response=await fetch(SUPABASE_URL+'/rest/v1/products?'+params.toString(),{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
  const body=await response.text();let data;try{data=JSON.parse(body)}catch{throw new Error('Supabase returned an unreadable response (HTTP '+response.status+').')}
  if(!response.ok)throw new Error(data.message||data.error||('Supabase request failed (HTTP '+response.status+').'));
  const products=(Array.isArray(data)?data:[]).filter(p=>p&&p.is_active!==false);
  if(!products.length){empty('No available saved products.','These products may have been removed or are no longer active.');return}
  host.innerHTML=products.map(p=>{const img=(Array.isArray(p.image_urls)?p.image_urls[0]:'')||'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80';const price=Number(p.sale_price)>0?Math.min(Number(p.sale_price),Number(p.price||0)):Number(p.price||0);return '<article class="item"><a class="photo" href="product.html?id='+encodeURIComponent(p.id)+'"><img src="'+safe(img)+'" alt="'+safe(p.name||'Product')+'" loading="lazy"></a><button class="remove" type="button" data-remove="'+safe(p.id)+'" aria-label="Remove from wishlist">×</button><div class="info"><p class="name">'+safe(p.name||'Product')+'</p><span class="price">'+money(price)+'</span><br><a class="shop" href="product.html?id='+encodeURIComponent(p.id)+'">VIEW PRODUCT ↗</a></div></article>'}).join('');
  host.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{const next=ids().filter(x=>x!==b.dataset.remove);localStorage.setItem('or_wishlist',JSON.stringify(next));render()}));
 }catch(e){host.innerHTML='<p class="error">Wishlist could not be loaded: '+safe(e.message||e)+'</p>'}
}
document.getElementById('refreshWishlist').addEventListener('click',render);
window.addEventListener('storage',e=>{if(e.key==='or_wishlist')render()});
render();
})();
</script>
</body></html>
