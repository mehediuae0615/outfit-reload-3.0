<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8ff"><title>bKash Payment | Outfit Reload 3.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#d12678;--deep:#b9002c;--ink:#718099;--line:#e8edf5;--bg:#f4f7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali",sans-serif;padding:0 0 32px;min-height:100vh}.page{width:min(100% - 28px,620px);margin:0 auto}.brandbar{height:100px;margin:0 auto 20px;background:#fff;border:1px solid #e5eaf2;border-radius:0 0 32px 32px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 18px #26334b08}.bkash-logo{font-family:Georgia,serif;font-size:36px;color:#c51d70;letter-spacing:-2px;display:flex;align-items:center;gap:5px}.kite{width:34px;height:43px;position:relative;display:inline-block}.kite:before{content:"";position:absolute;inset:3px;background:#d12678;clip-path:polygon(0 0,100% 28%,60% 55%,100% 100%,0 72%,30% 43%)}.kite:after{content:"";position:absolute;width:2px;height:42px;background:#b90054;left:16px;top:0;transform:rotate(38deg)}.back{display:block;margin:0 4px 12px;color:#77849a;text-decoration:none;font-size:12px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #26334b0c;margin-bottom:18px}.payment-head{padding:18px 22px;display:flex;align-items:center;gap:15px;color:#75839b;font-size:25px;font-weight:800}.pay-icon{width:70px;height:70px;border:2px solid #edf0f6;border-radius:50%;display:grid;place-items:center;color:#d12678;font-size:28px;font-weight:800;background:#fff}.amount{padding:20px 25px;font-size:30px;font-weight:800;color:#718099}.instructions{background:var(--pink);color:#fff;border-radius:17px;padding:24px 25px 20px;margin-bottom:18px}.instructions h1{text-align:center;font-size:23px;margin:0 0 20px;font-weight:700}.trx-input{width:100%;height:78px;border:4px solid #f4b6d0;border-radius:16px;background:#fff;padding:0 22px;font:600 21px "Noto Sans Bengali";color:#59677e;outline:none;margin-bottom:18px}.trx-input::placeholder{color:#8791a3}.trx-input:focus{border-color:#ffe0ec}.steps{list-style:none;margin:0;padding:0}.steps li{position:relative;padding:15px 0 15px 26px;border-bottom:1px solid #ffffff25;font-size:18px;line-height:1.75}.steps li:last-child{border-bottom:0;padding-bottom:4px}.steps li:before{content:"";position:absolute;left:2px;top:27px;width:9px;height:9px;border-radius:50%;background:#fff}.number{color:#fff000;font-weight:800;white-space:nowrap}.copy{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:11px;background:#a70e59;color:#fff;padding:8px 12px;font:600 15px "Noto Sans Bengali";cursor:pointer;margin-left:7px}.extra-fields{padding:20px 22px}.extra-fields h2{font-size:18px;margin:0 0 14px;color:#65748d}.field{display:block;margin:0 0 14px}.field span{display:block;font-size:14px;font-weight:700;margin-bottom:7px;color:#66758c}.field input{width:100%;height:54px;border:1px solid #dce3ed;border-radius:12px;padding:0 14px;font:16px "Noto Sans Bengali";outline:none}.field input:focus{border-color:var(--pink);box-shadow:0 0 0 3px #d1267819}.verify{width:100%;height:62px;border:0;border-radius:15px;background:var(--deep);color:white;font:700 22px "Noto Sans Bengali";cursor:pointer}.verify:active{transform:scale(.99)}.demo{display:none;margin-top:13px;padding:13px;border-radius:10px;background:#fff6e8;color:#805b1c;font-size:13px;line-height:1.7}.demo.show{display:block}.notice{text-align:center;color:#8b96a8;font-size:11px;line-height:1.7;padding:8px 12px}.footer{text-align:center;color:#a3adbd;font-size:10px;margin:18px 0}@media(max-width:430px){.brandbar{height:92px}.payment-head{font-size:22px;padding:16px 18px}.pay-icon{width:62px;height:62px}.amount{font-size:27px;padding:17px 22px}.instructions{padding:22px 18px 18px}.instructions h1{font-size:21px}.trx-input{height:72px;font-size:19px}.steps li{font-size:16px;padding:13px 0 13px 24px}.copy{font-size:13px;padding:7px 9px}.extra-fields{padding:18px}}
</style></head><body><main class="page"><div class="brandbar"><div class="bkash-logo">bKash <span class="kite" aria-hidden="true"></span></div></div><a class="back" href="index.html">← স্টোরে ফিরে যান</a><section class="card"><div class="payment-head"><span class="pay-icon">৳</span><span>Payment</span></div></section><section class="card amount"><span id="amountText">৳ ৮০</span></section><section class="instructions"><h1>ট্রানজেকশন আইডি দিন</h1><input class="trx-input" id="trxId" type="text" placeholder="ট্রানজেকশন আইডি দিন" autocomplete="off" autocapitalize="characters" maxlength="30" required><ul class="steps"><li>*247# ডায়াল করে আপনার bKash মোবাইল মেনুতে যান অথবা bKash অ্যাপ খুলুন।</li><li>Send Money-এ ক্লিক করুন।</li><li>এই নম্বরে টাকা পাঠান: <span class="number" id="receiverNumber">01XXXXXXXXX</span> <button class="copy" id="copyNumber" type="button">▣ কপি</button></li><li>টাকার পরিমাণ: <span class="number" id="amountInline">৮০</span></li><li>নিশ্চিত করে এখন আপনার bKash PIN লিখুন।</li><li>টাকা পাঠান এবং ট্রানজেকশন আইডি কপি করুন।</li><li>ট্রানজেকশন আইডি লিখে ভেরিফাই চাপুন।</li></ul></section><section class="card extra-fields"><h2>পেমেন্টের তথ্য</h2><label class="field"><span>যে নম্বর থেকে টাকা পাঠিয়েছেন</span><input id="senderNumber" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX" maxlength="14" required></label><button class="verify" id="verifyButton" type="button">ভেরিফাই</button><div class="demo" id="demoMessage" role="status"></div></section><p class="notice">পরীক্ষামূলক পেমেন্ট পেজ। এখনো স্বয়ংক্রিয় পেমেন্ট যাচাই চালু হয়নি। যাচাই সম্পন্ন না হওয়া পর্যন্ত অর্ডার নিশ্চিত হবে না।</p><p class="footer">© 2026 OUTFIT RELOAD 3.0</p></main>
<script>const BKASH_RECEIVER_NUMBER='01XXXXXXXXX';const params=new URLSearchParams(location.search);const amount=Math.max(0,Number(params.get('amount'))||80);const bn=n=>Number(n).toLocaleString('bn-BD');document.getElementById('receiverNumber').textContent=BKASH_RECEIVER_NUMBER;document.getElementById('amountText').textContent='৳ '+bn(amount);document.getElementById('amountInline').textContent=bn(amount);document.getElementById('copyNumber').addEventListener('click',async()=>{const b=document.getElementById('copyNumber');try{await navigator.clipboard.writeText(BKASH_RECEIVER_NUMBER);b.textContent='কপি হয়েছে'}catch{b.textContent='কপি করা যায়নি'}setTimeout(()=>b.textContent='▣ কপি',1600)});document.getElementById('verifyButton').addEventListener('click',()=>{const sender=document.getElementById('senderNumber').value.trim(),trx=document.getElementById('trxId').value.trim(),msg=document.getElementById('demoMessage');if(!/^01\d{9}$/.test(sender)){document.getElementById('senderNumber').setCustomValidity('১১ সংখ্যার bKash নম্বর দিন।');document.getElementById('senderNumber').reportValidity();document.getElementById('senderNumber').setCustomValidity('');return}if(!/^[A-Za-z0-9]{6,30}$/.test(trx)){document.getElementById('trxId').setCustomValidity('সঠিক TrxID লিখুন।');document.getElementById('trxId').reportValidity();document.getElementById('trxId').setCustomValidity('');return}msg.textContent='তথ্য জমা হয়েছে (ডেমো)। এখনো টাকা যাচাই বা অর্ডার নিশ্চিত করা হয়নি।';msg.classList.add('show')});</script></body></html>
